{% extends "table/base.html" %}
{% block content %}
{% load static %}

<div class="container mt-4">
    <div class="card">
        <div class="card-header bg-primary text-white">
            <h4><i class="bi bi-upload"></i> Импорт устройств из Excel</h4>
        </div>
        <div class="card-body">
            <form method="post" enctype="multipart/form-data" id="importForm">
                {% csrf_token %}
                
                <div class="mb-3">
                    <label for="fileInput" class="form-label">
                        <span id="fileLabel">Выберите файл Excel</span>
                        <div id="fileName" class="text-muted small mt-1" style="display: none;"></div>
                    </label>
                    <input type="file" class="form-control" id="fileInput" name="file" 
                           accept=".xlsx,.xls" required style="display: none;">
                    <button type="button" class="btn btn-outline-secondary" id="fileButton">
                        <i class="bi bi-folder2-open"></i> Выбрать файл
                    </button>
                </div>
                
                <button type="submit" class="btn btn-success" id="submitButton" disabled>
                    <i class="bi bi-upload"></i> Импортировать
                </button>
                <script src="{% static 'js/button-handler.js' %}"></script>
            </form>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const fileInput = document.getElementById('fileInput');
    const fileButton = document.getElementById('fileButton');
    const fileLabel = document.getElementById('fileLabel');
    const fileName = document.getElementById('fileName');
    const submitButton = document.getElementById('submitButton');
    
    // Обработка клика по кнопке выбора файла
    fileButton.addEventListener('click', function() {
        fileInput.click();
    });
    
    // Обработка выбора файла
    fileInput.addEventListener('change', function(e) {
        if (this.files && this.files[0]) {
            const file = this.files[0];
            fileName.textContent = file.name;
            fileName.style.display = 'block';
            fileLabel.textContent = 'Выбран файл:';
            submitButton.disabled = false;
            
            // Валидация расширения файла
            if (!file.name.match(/\.(xlsx|xls)$/i)) {
                alert('Пожалуйста, выберите файл Excel (.xlsx или .xls)');
                this.value = '';
                fileName.style.display = 'none';
                fileLabel.textContent = 'Выберите файл Excel';
                submitButton.disabled = true;
            }
        }
    });
    
    // Обработка отправки формы
    document.getElementById('importForm').addEventListener('submit', function(e) {
        if (!fileInput.files.length) {
            e.preventDefault();
            alert('Пожалуйста, выберите файл для загрузки');
            return false;
        }
        
        // Показываем индикатор загрузки
        submitButton.disabled = true;
        submitButton.innerHTML = '<i class="bi bi-arrow-repeat spinner"></i> Идет загрузка...';
    });
});
</script>

<style>
.spinner {
    animation: spin 1s linear infinite;
    display: inline-block;
}
@keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}
</style>
{% endblock %}
